<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales · Base Presents</title>
<link rel="icon" href="/assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a href="/buy"><img src="/assets/base-logo-white.png" alt="Base Presents"></a>
  <span class="badge" id="mode">Admin</span>
</header>
<main class="wrap">
  <span class="label" id="when">Sales overview</span>
  <h1 id="event">Sales</h1>

  <form id="login" class="card">
    <label><span class="label">Staff PIN</span><input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="btn" type="submit"><span>Open</span><span>→</span></button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section id="app" class="hidden">
    <div class="stats">
      <div><b id="sold">0</b><span class="label">Tickets sold</span></div>
      <div><b id="left">0</b><span class="label">Left</span></div>
      <div><b id="rev">0</b><span class="label">Revenue</span></div>
      <div><b id="in">0</b><span class="label">Checked in</span></div>
    </div>
    <div class="row" style="margin-bottom:12px"><span class="label">Last 200 orders · refreshes every 10 s</span>
      <a class="link" href="/scan">Open scanner →</a></div>
    <div class="scroll"><table>
      <thead><tr><th>Time</th><th>Name</th><th>Email</th><th>Qty</th><th>Amount</th><th>Status</th><th>Tickets</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const eur = (c) => (c / 100).toFixed(2).replace('.', ',') + ' €';
  let pin = '';
  try { pin = sessionStorage.getItem('bp-pin') || ''; } catch (e) {}

  async function load() {
    const r = await fetch('/api/admin/summary', { headers: { 'x-staff-pin': pin } });
    if (r.status === 401) {
      try { sessionStorage.removeItem('bp-pin'); } catch (e) {}
      $('app').classList.add('hidden'); $('login').classList.remove('hidden');
      $('msg').textContent = pin ? 'Wrong PIN' : '';
      pin = '';
      return;
    }
    const d = await r.json();
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('event').textContent = d.event.name;
    $('when').textContent = d.event.date + ' · ' + d.event.venue + ' · capacity ' + d.event.capacity;
    $('mode').textContent = d.mode === 'demo' ? 'Demo mode' : 'Stripe test mode';
    $('sold').textContent = d.sold; $('left').textContent = d.remaining;
    $('rev').textContent = eur(d.revenueCents); $('in').textContent = d.checkedIn;
    const tb = $('rows'); tb.innerHTML = '';
    d.orders.forEach((o) => {
      const tr = document.createElement('tr');
      const cells = [new Date(o.created_at).toLocaleString('sk-SK'), o.name, o.email, o.qty, eur(o.amount_cents), o.status];
      cells.forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      const td = document.createElement('td');
      if (o.link) { const a = document.createElement('a'); a.href = o.link; a.textContent = 'Open'; td.appendChild(a); }
      tr.appendChild(td); tb.appendChild(tr);
    });
  }

  $('login').onsubmit = (e) => {
    e.preventDefault();
    pin = $('pin').value.trim();
    try { sessionStorage.setItem('bp-pin', pin); } catch (e) {}
    load();
  };
  if (pin) load();
  setInterval(() => { if (pin) load(); }, 10000);
</script>
</body>
</html>
