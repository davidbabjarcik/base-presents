<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos · Base Presents</title>
<meta name="description" content="Photo reports from Chodbovica and Chillout by Base Presents, Košice.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{opacity:.72}
.label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A3A3A3}
header{border-bottom:1px solid #262626}
header nav{max-width:1280px;margin:0 auto;padding:20px clamp(20px,4vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px}
header img{height:24px;width:auto;display:block}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(16px,4vw,32px) 80px}
h1{margin:12px 0 16px;font-family:Montserrat,Inter,sans-serif;font-weight:700;font-size:clamp(40px,7vw,96px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border:1px solid #fff;font-weight:600;font-size:15px}
/* Masonry grid with CSS columns */
.grid{columns:4 260px;column-gap:8px}
.grid button{all:unset;display:block;margin:0 0 8px;cursor:zoom-in;break-inside:avoid;position:relative;background:#141414;width:100%}
.grid img{display:block;width:100%;height:auto;transition:opacity .3s}
.grid button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.grid button:hover img{opacity:.85}
/* Albums list */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.album{display:flex;flex-direction:column;gap:12px}
.album .img{aspect-ratio:4/3;background:#141414;overflow:hidden}
.album img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);transition:filter .5s,transform .8s cubic-bezier(.2,.7,.2,1)}
.album:hover img{filter:none;transform:scale(1.03)}
.album h2{margin:0;font-family:Montserrat,Inter,sans-serif;font-weight:700;font-size:24px;text-transform:uppercase}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb[hidden]{display:none}
.lb img{max-width:100vw;max-height:100vh;max-height:100dvh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.lb .bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(#000c,#0000)}
.lb button,.lb a.icon{all:unset;cursor:pointer;min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.lb button:focus-visible,.lb a.icon:focus-visible{outline:2px solid #fff}
.lb .prev,.lb .next{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;width:64px;height:96px}
.lb .prev{left:4px}.lb .next{right:4px}
@media (hover:none){.lb .prev,.lb .next{display:none}}
.empty{color:#A3A3A3}
footer{border-top:1px solid #262626;padding:24px clamp(16px,4vw,32px);font-family:'JetBrains Mono',monospace;font-size:12px;color:#A3A3A3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<header><nav>
  <a href="./" aria-label="Base Presents, home"><img src="assets/base-logo-white.png" alt=""></a>
  <a class="label" href="./#archive" style="color:#fff">← Back to the site</a>
</nav></header>

<main class="wrap">
  <span class="label" id="kicker">Photo reports</span>
  <h1 id="title">Photos</h1>
  <div class="meta" id="meta"></div>
  <div id="content"><p class="empty">Loading…</p></div>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="bar">
    <span class="label" id="lb-count" style="color:#fff"></span>
    <span>
      <a class="icon" id="lb-dl" download title="Download photo" aria-label="Download photo">↓</a>
      <button id="lb-close" title="Close (Esc)" aria-label="Close">✕</button>
    </span>
  </div>
  <button class="prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <img id="lb-img" alt="">
  <button class="next" id="lb-next" aria-label="Next photo">›</button>
</div>

<footer><span>© Base Presents · Košice</span><span style="display:flex;gap:20px"><a href="https://www.instagram.com/base.presents/" target="_blank" rel="noopener">Instagram ↗</a><a href="https://www.facebook.com/BASEPresentsSlovakia" target="_blank" rel="noopener">Facebook ↗</a></span></footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') el.className = v; else el.setAttribute(k, v); }
    kids.flat().forEach((k) => k != null && el.append(k.nodeType ? k : String(k)));
    return el;
  };
  const fmtDate = (d) => new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const slug = new URLSearchParams(location.search).get('a');

  // ---------- All albums ----------
  async function showList() {
    const list = await fetch('photos/albums.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : [])).catch(() => []);
    $('title').textContent = 'Photos';
    $('content').replaceChildren(list.length
      ? h('div', { class: 'albums' }, list.map((a) => h('a', { class: 'album', href: '?a=' + encodeURIComponent(a.slug) },
          h('div', { class: 'img' }, h('img', { src: `photos/${a.slug}/thumbs/${a.cover.f}`, alt: a.title, loading: 'lazy', width: a.cover.w, height: a.cover.h })),
          h('span', { class: 'label' }, `${fmtDate(a.date)} · ${a.count} photos`),
          h('h2', {}, a.title))))
      : h('p', { class: 'empty' }, 'No photo reports yet.'));
  }

  // ---------- One album ----------
  async function showAlbum() {
    const r = await fetch(`photos/${encodeURIComponent(slug)}/album.json`, { cache: 'no-cache' }).catch(() => null);
    if (!r || !r.ok) { $('title').textContent = 'Not found'; $('content').replaceChildren(h('p', { class: 'empty' }, 'This photo report does not exist. ', h('a', { href: 'gallery.html', style: 'text-decoration:underline' }, 'All photos →'))); return; }
    const a = await r.json();
    const base = `photos/${a.slug}/`;
    document.title = `${a.title} · Photos · Base Presents`;
    $('kicker').textContent = a.series !== 'Other' ? a.series + ' · photo report' : 'Photo report';
    $('title').textContent = a.title;
    $('meta').replaceChildren(...[
      h('span', { class: 'label', style: 'color:#fff' }, fmtDate(a.date)),
      h('span', { class: 'label' }, `${a.photos.length} photos`),
      a.by ? h('span', { class: 'label' }, 'Photos: ' + a.by) : null,
      a.originals ? h('a', { class: 'btn', href: a.originals, target: '_blank', rel: 'noopener' }, 'Full resolution ↗') : null,
      h('button', { class: 'btn', type: 'button', style: 'background:none;color:#fff;cursor:pointer;font:inherit;font-weight:600', onclick: share }, 'Share'),
      h('a', { class: 'label', href: 'gallery.html', style: 'text-decoration:underline' }, 'All photo reports')].filter(Boolean));
    $('content').replaceChildren(h('div', { class: 'grid' }, a.photos.map((p, i) => h('button', { type: 'button', 'aria-label': `Open photo ${i + 1}`, 'data-i': i },
      h('img', { src: base + 'thumbs/' + p.f, alt: `${a.title}, photo ${i + 1}`, loading: i < 8 ? 'eager' : 'lazy', width: p.w, height: p.h })))));
    $('content').querySelector('.grid').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) open(Number(b.dataset.i)); });
    setupLightbox(a, base);
    const fromHash = Number(location.hash.slice(1));
    if (fromHash >= 1 && fromHash <= a.photos.length) open(fromHash - 1);

    async function share() {
      const url = location.href.split('#')[0];
      if (navigator.share) { try { await navigator.share({ title: a.title + ' · Base Presents', url }); } catch (e) {} }
      else { try { await navigator.clipboard.writeText(url); alert('Link copied'); } catch (e) { prompt('Copy the link:', url); } }
    }
  }

  // ---------- Lightbox ----------
  let open = () => {};
  function setupLightbox(a, base) {
    const lb = $('lb'), img = $('lb-img');
    let i = 0, lastFocus = null;
    const src = (k) => base + a.photos[k].f;
    function show(k) {
      i = (k + a.photos.length) % a.photos.length;
      img.style.opacity = 0;
      img.onload = () => { img.style.opacity = 1; };
      img.src = src(i);
      img.alt = `${a.title}, photo ${i + 1}`;
      $('lb-count').textContent = `${i + 1} / ${a.photos.length}`;
      $('lb-dl').href = src(i);
      $('lb-dl').setAttribute('download', `${a.slug}-${a.photos[i].f}`);
      history.replaceState(null, '', '#' + (i + 1));
      [i + 1, i - 1].forEach((n) => { const k2 = (n + a.photos.length) % a.photos.length; new Image().src = src(k2); }); // preload neighbours
    }
    open = (k) => { lastFocus = document.activeElement; lb.hidden = false; document.body.style.overflow = 'hidden'; show(k); $('lb-close').focus(); };
    const close = () => { lb.hidden = true; document.body.style.overflow = ''; history.replaceState(null, '', location.pathname + location.search); lastFocus?.focus(); };
    $('lb-close').onclick = close;
    $('lb-prev').onclick = () => show(i - 1);
    $('lb-next').onclick = () => show(i + 1);
    lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
    document.addEventListener('keydown', (e) => {
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowRight') show(i + 1);
      if (e.key === 'ArrowLeft') show(i - 1);
    });
    // Swipe on phones
    let sx = null, sy = null;
    lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    lb.addEventListener('touchend', (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(i + (dx < 0 ? 1 : -1));
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close(); // swipe down closes
      sx = sy = null;
    });
  }

  (slug ? showAlbum() : showList());
})();
</script>
</body>
</html>
