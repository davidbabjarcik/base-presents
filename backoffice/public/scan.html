<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door scanner · Base Presents</title>
<link rel="icon" href="/assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/hub.css">
<script src="/hub.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<main class="wrap" style="display:flex;flex-direction:column;gap:20px;max-width:520px">
  <h1 style="margin:0">Scanner</h1>


  <section id="app" style="display:flex;flex-direction:column;gap:20px">
    <div id="result" class="result bad"><strong>Ready</strong><span>Scan a ticket QR code</span></div>
    <div id="reader"></div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="cam" type="button"><span>Start camera</span><span>◉</span></button>
      <button class="btn ghost" id="torch" type="button" hidden aria-pressed="false" style="width:auto;flex:none"><span>⚡ Flash off</span></button>
    </div>
    <p class="muted" id="torch-note" hidden style="margin:0;font-size:13px">This phone or browser does not let websites turn on the flash. Turn up the screen brightness or use a light.</p>
    <form id="manual" style="display:flex;gap:8px">
      <input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" aria-label="Ticket code">
      <button class="btn" type="submit" style="width:auto"><span>Check</span></button>
    </form>
    <p class="muted" style="margin:0">The camera works on <code>localhost</code> or an <code>https://</code> address. On other setups type the code from the ticket.</p>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false, lastCode = '', lastAt = 0, scanner = null;

  function show(data) {
    const el = $('result');
    const ok = data.result === 'ok';
    el.className = 'result ' + (ok ? 'ok' : 'bad');
    const title = { ok: 'Valid', used: 'Used', invalid: 'Invalid', auth: 'Log in' }[data.result] || 'Error';
    el.innerHTML = '<strong></strong><span></span>';
    el.querySelector('strong').textContent = title;
    el.querySelector('span').textContent = [data.message, data.holder, data.code].filter(Boolean).join(' · ');
    if (navigator.vibrate) navigator.vibrate(ok ? 80 : [60, 60, 60]);
  }

  async function check(code) {
    const now = Date.now();
    if (busy || (code === lastCode && now - lastAt < 3000)) return; // ignore the same QR seen twice in a row
    busy = true; lastCode = code; lastAt = now;
    try {
      const r = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await r.json();
      show(data);
      if (data.result === 'auth') toLogin();
    } catch (e) {
      show({ result: 'error', message: 'No connection' });
    } finally { busy = false; }
  }

  const toLogin = () => location.replace('/login?next=/scan');
  Hub.start('tickets');

  $('manual').onsubmit = (e) => { e.preventDefault(); const c = $('code').value.trim(); if (c) check(c); $('code').value = ''; };

  // ---- Flash (torch) ----
  // Works where the browser allows it (Chrome on Android). Elsewhere the button stays hidden and a tip is shown.
  let torchOn = false;
  function torchSupported() {
    try {
      const caps = scanner && scanner.getRunningTrackCapabilities && scanner.getRunningTrackCapabilities();
      return Boolean(caps && 'torch' in caps);
    } catch (e) { return false; }
  }
  async function setTorch(on) {
    if (!scanner) return;
    try {
      await scanner.applyVideoConstraints({ advanced: [{ torch: on }] });
      torchOn = on;
    } catch (e) {
      torchOn = false;
      if (on) show({ result: 'error', message: 'Flash could not be turned on' });
    }
    $('torch').firstElementChild.textContent = torchOn ? '⚡ Flash on' : '⚡ Flash off';
    $('torch').setAttribute('aria-pressed', String(torchOn));
    $('torch').classList.toggle('on', torchOn);
    $('torch').style.background = torchOn ? '#fff' : '';
    $('torch').style.color = torchOn ? '#000' : '';
  }
  $('torch').onclick = () => setTorch(!torchOn);

  $('cam').onclick = async () => {
    if (!window.Html5Qrcode) { show({ result: 'error', message: 'Scanner library did not load' }); return; }
    if (scanner) {
      if (torchOn) await setTorch(false);
      await scanner.stop(); scanner = null;
      $('cam').firstElementChild.textContent = 'Start camera';
      $('torch').hidden = true; $('torch-note').hidden = true;
      return;
    }
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, (text) => check(text.trim()));
      $('cam').firstElementChild.textContent = 'Stop camera';
      const ok = torchSupported();
      $('torch').hidden = !ok;
      $('torch-note').hidden = ok;
    } catch (err) {
      scanner = null;
      show({ result: 'error', message: 'Camera not available: ' + err });
    }
  };
</script>
</body>
</html>
